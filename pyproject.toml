[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meer-fake-news-classification"
version = "1.0.0"
description = "Meer Mathur's fake news website classifier"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Meer Mathur"}]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<1.8",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "requests>=2.33,<3", "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.15"]
generation = ["tensorflow>=2.18,<2.21"]

[project.scripts]
fake-news = "fake_news.cli:main"
fake-news-generate = "fake_news.generation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
